<section class="seguimiento" aria-labelledby="seg-titulo">
  <app-page-header
    eyebrow="Resumen de Operaciones"
    tituloId="seg-titulo"
    titulo="Seguimiento y Rendimiento"
    subtitulo="Monitorea tus comisiones acumuladas, KPIs del mes y el estado de radicación en tiempo real."
  >
    <div acciones>
      <app-guarantee-badge icono="verified" variante="tertiary">Tarifas 2026 Vigentes</app-guarantee-badge>
      <app-guarantee-badge icono="bolt" variante="primary">Cotizador Express</app-guarantee-badge>
    </div>
  </app-page-header>

  <!-- Banner Herramienta Rápida (Req 5.1, 5.5) -->
  <app-quick-tool-banner
    titulo="Cotiza en segundos la póliza ideal para tu cliente"
    descripcion="Calcula primas, coberturas y comisiones al instante. Comparte la cotización directamente con tu cliente."
    textoAccion="Ir al cotizador"
    (accion)="irAlCotizador()"
  ></app-quick-tool-banner>

  <!-- Dashboard grid: comisión (izq, ancha) + KPIs (der, 2x2) (Req 5.2, 5.3) -->
  <div class="dash-grid">
    <!-- Tarjeta de comisión estimada con barra apilada por ramo (Req 5.2) -->
    <app-commission-breakdown-card
      class="dash-comm"
      [valorEstimado]="comisiones()?.valorEstimado ?? 0"
      [periodo]="comisiones()?.periodo ?? ''"
      [polizasRadicadas]="comisiones()?.polizasRadicadas ?? 0"
      [desglose]="comisiones()?.desglose ?? []"
    />

    <!-- KPIs en grid 2x2 con íconos + delta de tendencia (Req 5.3, 5.4) -->
    <div class="dash-kpis-grid">
      <app-kpi-card
        label="Primas generadas"
        [valor]="kpis() ? formatearCop(kpis()!.primasGeneradas) : '—'"
        icono="trending_up"
        delta="+12.4%"
        [deltaPositivo]="true"
        sub="COP en primas brutas"
      />
      <app-kpi-card
        label="Total radicadas"
        [valor]="kpis()?.totalRadicadas ?? '—'"
        icono="contract"
        variante="exito"
        delta="91% efectividad"
        [deltaPositivo]="true"
        sub="Solicitudes gestionadas"
      />
      <app-kpi-card
        label="En revisión"
        [valor]="kpis()?.enRevision ?? '—'"
        icono="pending_actions"
        sub="En mesa de suscripción · ~45 min"
      />
      <!-- KPI de alerta con estilo danger (Req 5.4) -->
      <app-kpi-card
        label="Bloqueadas"
        [valor]="kpis()?.bloqueadas ?? '—'"
        icono="warning"
        variante="alerta"
        delta="Falta doc. SARLAFT"
        [deltaPositivo]="false"
        sub="Subsanar ahora"
      />
    </div>
  </div>

  <!-- Filtrado inteligente colapsable (Req 6.2) -->
  <app-filtrado-inteligente [totalFiltros]="5">
    <div class="seg-filtros-grid">
      <label class="seg-filtro">
        <span>Búsqueda</span>
        <input
          type="text"
          placeholder="Nombre, ref o cédula..."
          [ngModel]="busqueda()"
          (ngModelChange)="busqueda.set($event)"
        />
      </label>
      <label class="seg-filtro">
        <span>Producto</span>
        <select [ngModel]="producto()" (ngModelChange)="producto.set($event)">
          <option value="">Todos</option>
          @for (p of productos; track p) {
            <option [value]="p">{{ p }}</option>
          }
        </select>
      </label>
      <label class="seg-filtro">
        <span>Estado</span>
        <select [ngModel]="estado()" (ngModelChange)="estado.set($event)">
          <option value="">Todos</option>
          @for (e of estados; track e.valor) {
            <option [value]="e.valor">{{ e.etiqueta }}</option>
          }
        </select>
      </label>
      <label class="seg-filtro">
        <span>Desde</span>
        <input type="date" [ngModel]="fechaDesde()" (ngModelChange)="fechaDesde.set($event)" />
      </label>
      <label class="seg-filtro">
        <span>Hasta</span>
        <input type="date" [ngModel]="fechaHasta()" (ngModelChange)="fechaHasta.set($event)" />
      </label>
    </div>
    <div class="seg-filtros-acciones">
      <button type="button" class="seg-btn-ghost" (click)="limpiarFiltros()">
        Limpiar filtros
      </button>
      <button type="button" class="seg-btn-accent" (click)="aplicarFiltros()">
        Aplicar filtros
      </button>
    </div>
  </app-filtrado-inteligente>

  <!-- Tabla de solicitudes con paginación (Req 6.1, 6.5) -->
  @if (errorTabla(); as error) {
    <app-alert-banner variante="error" titulo="No se pudieron cargar las solicitudes">
      {{ error }}
      <app-boton variante="outline" (clicked)="aplicarFiltros()">Reintentar</app-boton>
    </app-alert-banner>
  }
  @if (cargandoTabla() && filas().length === 0) {
    <app-skeleton [lineas]="6" [alto]="28" ariaLabel="Cargando solicitudes" />
  } @else {
  <app-data-table
    [columnas]="columnas"
    [filas]="filas()"
    [total]="total()"
    [paginaActual]="paginaActual()"
    [tamanoPagina]="tamanoPagina"
    [conBusqueda]="true"
    placeholderBusqueda="Buscar por cliente, referencia o producto..."
    ariaLabel="Tabla de solicitudes de seguimiento"
    (cambioPagina)="onCambioPagina($event)"
    (seleccionFila)="onSeleccionFila($event)"
    (accion)="onGestionar($event)"
  ></app-data-table>
  }

  <!-- Detalle de la solicitud seleccionada (drawer) (Req 6.4, 34) -->
  <app-detalle-solicitud
    [referencia]="referenciaSeleccionada()"
    (cerrar)="onCerrarDetalle()"
  ></app-detalle-solicitud>
</section>
