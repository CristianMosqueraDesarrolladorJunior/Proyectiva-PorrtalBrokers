<section class="documentos" aria-labelledby="documentos-titulo">
  <app-page-header
    eyebrow="Recursos"
    tituloId="documentos-titulo"
    titulo="Documentos"
    subtitulo="Formatos, plantillas, clausulados e instructivos de apoyo."
  ></app-page-header>

  @for (seccion of secciones; track trackSeccion($index, seccion)) {
    <div class="doc-section">
      <h3 class="doc-section__titulo">{{ seccion.titulo }}</h3>
      <div class="doc-list">
        @for (recurso of seccion.recursos; track trackRecurso($index, recurso)) {
          <div class="doc-item">
            <span class="doc-icon" aria-hidden="true"><span class="material-symbols-outlined">{{ recurso.icono }}</span></span>
            <div class="doc-info">
              <strong>{{ recurso.titulo }}</strong>
              <small>{{ recurso.descripcion }}</small>
            </div>
            <button
              type="button"
              class="doc-btn"
              [attr.aria-label]="etiquetaAccion(recurso) + ' ' + recurso.titulo"
              (click)="abrir(recurso)"
            >
              {{ etiquetaAccion(recurso) }}
            </button>
          </div>
        }
      </div>
    </div>
  }
</section>
