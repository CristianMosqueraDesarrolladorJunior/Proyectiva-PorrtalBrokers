<section class="calendario" aria-labelledby="calendario-titulo">
  <app-page-header
    eyebrow="Agenda"
    tituloId="calendario-titulo"
    titulo="Calendario"
    subtitulo="Inicio de tus contratos, cotizaciones, vencimientos de pólizas y renovaciones. Los días que ya pasaron se ven atenuados; elige uno para ver sus eventos."
  ></app-page-header>

  <div class="calendario__nav">
    <button type="button" class="calendario__nav-btn" aria-label="Mes anterior" (click)="cambiarMes(-1)">‹</button>
    <button type="button" class="calendario__nav-btn" aria-label="Mes siguiente" (click)="cambiarMes(1)">›</button>
  </div>

  @if (cargando()) {
    <p class="calendario__estado" role="status">Cargando tu calendario…</p>
  } @else if (error()) {
    <div class="calendario__estado" role="alert">
      <p>{{ error() }}</p>
      <button type="button" class="calendario__reintentar" (click)="cargar()">Reintentar</button>
    </div>
  } @else {
    <app-calendario-mensual
      [anio]="anio()"
      [mes]="numeroMes()"
      [eventos]="eventosVista()"
      (gestionar)="gestionar($event)"
    ></app-calendario-mensual>
  }
</section>
