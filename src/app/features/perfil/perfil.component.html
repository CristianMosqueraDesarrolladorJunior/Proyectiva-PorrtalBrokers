<section class="perfil" aria-labelledby="perfil-titulo">
  <app-page-header
    tituloId="perfil-titulo"
    eyebrow="Mi cuenta"
    titulo="Mi perfil"
    subtitulo="Información de tu sesión en el portal."
  />

  @if (perfilSesion(); as perfil) {
    <div class="perfil__tarjeta">
      <app-avatar-initials [nombre]="perfil.nombre" [tamano]="56" />
      <div class="perfil__datos">
        <p class="perfil__nombre">{{ perfil.nombre }}</p>
        <p class="perfil__meta">
          <app-icon nombre="badge" [tamano]="16" />
          <span>{{ perfil.rol }}</span>
        </p>
        <p class="perfil__meta">
          <app-icon nombre="verified_user" [tamano]="16" />
          <span>Estado de la cuenta: {{ etiquetaEstado() }}</span>
        </p>
      </div>
    </div>

    <app-info-box icono="info">
      El detalle editable de tu perfil (datos personales, documentos, SARLAFT y
      comisiones) estará disponible próximamente.
    </app-info-box>
  } @else {
    <app-info-box icono="info">
      No hay información de sesión disponible.
    </app-info-box>
  }
</section>
