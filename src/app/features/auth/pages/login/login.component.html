<main class="login" role="main">
  <section class="login-card" aria-labelledby="login-titulo">
    <header class="login-header">
      <img class="login-marca" src="img/proyectiva-logo.svg" alt="Proyectiva Agencia de Seguros" width="595" height="150" />
      <h2 id="login-titulo" class="login-titulo">Iniciar sesión</h2>
      <p class="login-subtitulo">Ingresa a Portal Brokers Proyectiva</p>
    </header>

    <form
      class="login-form"
      [formGroup]="formulario"
      (ngSubmit)="iniciarSesion()"
      novalidate
    >
      <app-form-field
        label="Cédula o correo"
        ayuda="Ingresa tu número de cédula o tu correo electrónico"
        controlId="login-usuario"
        [requerido]="true"
        [error]="errorUsuario"
      >
        <input
          id="login-usuario"
          class="login-input"
          type="text"
          inputmode="email"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          formControlName="usuario"
          [attr.maxlength]="usuarioLongitudMax"
          [attr.aria-invalid]="!!errorUsuario"
          [attr.aria-describedby]="'login-usuario-ayuda'"
        />
      </app-form-field>

      <app-form-field
        label="Contraseña"
        controlId="login-password"
        [requerido]="true"
        [error]="errorPassword"
      >
        <input
          id="login-password"
          class="login-input"
          type="password"
          autocomplete="current-password"
          formControlName="password"
          [attr.aria-invalid]="!!errorPassword"
        />
      </app-form-field>

      <app-boton
        variante="primary"
        type="submit"
        [disabled]="!formularioValido || enviando()"
      >
        {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
      </app-boton>

      <button
        type="button"
        class="login-olvido"
        [disabled]="restableciendo()"
        (click)="restablecerPassword()"
      >
        {{ restableciendo() ? 'Enviando enlace...' : '¿Es tu primera vez o no recuerdas tu contraseña?' }}
      </button>
    </form>

    <footer class="login-footer">
      <p class="login-registro-texto">¿Nuevo broker?</p>
      <app-boton
        variante="ghost"
        ariaLabel="Me interesa vender pólizas: iniciar registro de nuevo broker"
        (clicked)="irARegistro()"
      >
        Me interesa vender pólizas
      </app-boton>
    </footer>
  </section>
</main>
