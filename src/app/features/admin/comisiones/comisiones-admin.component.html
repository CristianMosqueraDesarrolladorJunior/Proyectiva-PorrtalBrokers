<section class="vista" aria-labelledby="comisiones-admin-titulo">
  <app-page-header
    [eyebrow]="esAdmin ? 'Consola de administración' : 'Mi cartera'"
    tituloId="comisiones-admin-titulo"
    titulo="Cuentas de cobro"
    subtitulo="Documentos que generan los brokers. El cobro lo hace cada broker en la plataforma de proveedores de Seguros Bolívar: aquí no se manejan pagos."
  ></app-page-header>

  <app-grid-layout tipo="kpi-grid">
    <app-kpi-card label="Cuentas de cobro" [valor]="cuentas().length" icono="receipt_long" sub="Generadas por los brokers" />
    <app-kpi-card label="Pólizas incluidas" [valor]="totalPolizas()" icono="policy" sub="En esas cuentas" />
    <app-kpi-card label="Comisión en cuentas de cobro" [valor]="compacto(totalDocumentos())" icono="description" sub="Suma de las cuentas vigentes" />
  </app-grid-layout>

  <app-estado-vista
    [cargando]="cargando()"
    [error]="error()"
    [vacio]="filas().length === 0"
    entidad="cuentas de cobro"
    iconoVacio="receipt_long"
    tituloVacio="Aún no hay cuentas de cobro"
    descripcionVacio="Aparecen cuando un broker registrado genera su cuenta de cobro."
    (reintentar)="cargar()"
  >
    <app-data-table
      [columnas]="columnas"
      [filas]="filas()"
      [total]="filas().length"
      [tamanoPagina]="20"
      [conBusqueda]="true"
      placeholderBusqueda="Buscar por broker o comercial…"
      ariaLabel="Cuentas de cobro"
      (accion)="abrir($event)"
    />
  </app-estado-vista>
</section>

<app-modal-dialog
  [abierto]="seleccionada() !== null"
  [titulo]="'Cuenta de cobro de ' + (seleccionada()?.broker ?? '')"
  [subtitulo]="plural(seleccionada()?.polizas ?? 0, 'póliza', 'pólizas') + ' · ' + compacto(seleccionada()?.totalComision ?? 0)"
  eyebrow="Cuentas de cobro"
  tamano="xl"
  [pestanas]="pestanas"
  [pestana]="pestana()"
  (pestanaChange)="cambiarPestana($event)"
  (cerrar)="seleccionada.set(null)"
>
  @if (seleccionada(); as c) {
    @switch (pestana()) {
      @case ('detalle') {
        <app-ficha [secciones]="ficha()" />
      }
      @case ('documento') {
        <app-visor-archivo [archivo]="archivo()" [cargando]="cargandoArchivo()" [nombre]="'cuenta-de-cobro-' + c.id + '.pdf'" />
      }
    }
  }
</app-modal-dialog>
