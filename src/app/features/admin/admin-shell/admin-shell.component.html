<div class="app-wrapper" [class.app-wrapper--sidebar-abierto]="sidebarAbierto()" [class.app-wrapper--colapsado]="layout.sidebarColapsado()">
  <header class="topbar admin-topbar">
    <button type="button" class="admin-topbar__menu" aria-label="Abrir menú" (click)="alternarSidebar()">
      <app-icon nombre="menu" [tamano]="22" />
    </button>
    <div class="admin-topbar__titulo">
      <app-icon nombre="admin_panel_settings" [tamano]="22" />
      <strong>Consola de brokers</strong>
    </div>
    @if (perfil(); as p) {
      <span class="admin-topbar__rol" [class.admin-topbar__rol--comercial]="p.rol === 'COMERCIAL'">{{ p.rol }}</span>
    }
  </header>

  <div id="sidebar-navegacion">
    <app-sidebar
      [abierto]="sidebarAbierto()"
      [accesos]="accesos()"
      base="/admin"
      subtitulo="Consola operación"
      [mostrarVip]="false"
      [conSalir]="true"
      (cerrar)="cerrarSidebar()"
      (salir)="salir()"
    />
  </div>
  <div class="sidebar-overlay" (click)="cerrarSidebar()" aria-hidden="true"></div>

  <main class="main-content" id="contenido-principal" tabindex="-1">
    <router-outlet />
  </main>
</div>
