<div class="app-wrapper" [class.app-wrapper--sidebar-abierto]="sidebarAbierto()" [class.app-wrapper--colapsado]="layout.sidebarColapsado()">
  <!-- Misma barra que el portal del broker: buscador Ctrl+K sobre la cartera del perfil (sin campana). -->
  <app-topbar class="topbar" [menuAbierto]="sidebarAbierto()" [conNotificaciones]="false" (menu)="alternarSidebar()">
    @if (perfil(); as p) {
      <span class="admin-topbar__rol" [class.admin-topbar__rol--comercial]="p.rol === 'COMERCIAL'">{{ p.rol }}</span>
    }
  </app-topbar>

  <div id="sidebar-navegacion">
    <app-sidebar
      [abierto]="sidebarAbierto()"
      [accesos]="accesos()"
      base="/admin"
      subtitulo="Portal Brokers"
      [mostrarVip]="false"
      [conSalir]="true"
      (cerrar)="cerrarSidebar()"
      (salir)="salir()"
    />
  </div>
  <div class="sidebar-overlay" (click)="cerrarSidebar()" aria-hidden="true"></div>

  <main class="main-content" id="contenido-principal" tabindex="-1">
    <router-outlet />
  </main>
</div>

<!-- Recorrido por la plataforma, vista por vista (primer ingreso; se reabre desde «Ver recorrido»). -->
<app-recorrido-plataforma />
