<section class="vista" aria-labelledby="resumen-titulo">
  <app-page-header
    [eyebrow]="esAdmin ? 'Consola de administración' : 'Mi cartera'"
    tituloId="resumen-titulo"
    [titulo]="esAdmin ? 'Comportamiento del negocio' : 'Hola, ' + (perfil()?.nombre ?? '')"
    subtitulo="Primas emitidas, cartera asegurada, radicaciones, renovaciones y comisiones de los brokers, con la actividad en vivo."
  ></app-page-header>

  <app-filtrado-inteligente [totalFiltros]="esAdmin ? 4 : 3" idCuerpo="resumen-filtros">
    <div class="seg-filtros-grid">
      @if (esAdmin) {
        <label class="seg-filtro">
          <span>Comercial</span>
          <select id="resumen-comercial" [value]="fComercial()" (change)="cambiarComercial($any($event.target).value)">
            <option value="">Todos</option>
            @for (c of comerciales(); track c.codigo) {
              <option [value]="c.codigo">{{ c.nombre }}{{ c.activo ? '' : ' (inactivo)' }}</option>
            }
          </select>
        </label>
      }
      <label class="seg-filtro">
        <span>Broker</span>
        <!-- Mientras escribe filtra movimientos y rankings; al confirmar (Enter o salir del campo) recalcula los indicadores. -->
        <input id="resumen-broker" type="search" autocomplete="off" placeholder="Nombre del broker…"
          [value]="fBroker()" (input)="fBroker.set($any($event.target).value)"
          (change)="cambiarFiltro('broker', $any($event.target).value)" />
      </label>
      <label class="seg-filtro">
        <span>Desde</span>
        <input id="resumen-desde" type="date" [value]="fDesde()" [max]="fHasta() || null" (change)="cambiarFiltro('desde', $any($event.target).value)" />
      </label>
      <label class="seg-filtro">
        <span>Hasta</span>
        <input id="resumen-hasta" type="date" [value]="fHasta()" [min]="fDesde() || null" (change)="cambiarFiltro('hasta', $any($event.target).value)" />
      </label>
    </div>
    <div class="seg-filtros-acciones">
      <button type="button" class="seg-btn-ghost" [disabled]="!hayFiltros()" (click)="limpiarFiltros()">Limpiar filtros</button>
    </div>
  </app-filtrado-inteligente>

  <app-estado-vista
    [cargando]="cargando()"
    [error]="error()"
    [vacio]="!resumen()"
    entidad="resumen"
    [lineas]="3"
    [altoLinea]="120"
    (reintentar)="cargarResumen()"
  >
    @if (resumen(); as r) {
      <div class="resumen">
        <details class="resumen__seccion" open>
          <summary class="resumen__grupo">Producción y primas</summary>
        <app-grid-layout tipo="kpi-grid">
          <app-kpi-card label="Primas emitidas" [valor]="compacto(r.ingresos)" icono="account_balance" [sub]="r.polizasExpedidas + ' pólizas de arrendamiento expedidas'" variante="exito" />
          <app-kpi-card label="Canon mensual asegurado" [valor]="compacto(r.indicadores.canonAsegurado)" icono="home_work" sub="Amparo básico de las pólizas vigentes" />
          <app-kpi-card label="Valor asegurado" [valor]="compacto(r.indicadores.valorAsegurado)" icono="shield" sub="Suma asegurada total de la cartera" />
          <app-kpi-card label="Primas por canal" [valor]="compacto(r.ingresosBrokers)" icono="verified_user" [sub]="'Brokers · ' + compacto(r.ingresosProspectos) + ' de prospectos'" />
        </app-grid-layout>
        </details>

        <details class="resumen__seccion" open>
          <summary class="resumen__grupo">Radicaciones</summary>
        <app-grid-layout tipo="kpi-grid">
          <app-kpi-card label="Radicaciones en estudio" [valor]="r.indicadores.enEstudio" icono="query_stats" sub="Radicadas y en análisis de riesgo" />
          <app-kpi-card label="Radicaciones en corrección" [valor]="r.indicadores.enCorreccion" icono="rule" [tono]="r.indicadores.enCorreccion > 0 ? 'accent' : 'none'" sub="Esperan documentos del broker" />
          <app-kpi-card label="Aprobadas por expedir" [valor]="r.indicadores.aprobadasSinExpedir" icono="task_alt" sub="Listas para expedir la póliza" />
          <app-kpi-card label="Documentos en el expediente" [valor]="r.indicadores.documentosCargados" icono="folder_open" [sub]="r.indicadores.legalizacionesEnRevision + ' legalizaciones de broker por revisar'" />
        </app-grid-layout>
        </details>

        <details class="resumen__seccion" open>
          <summary class="resumen__grupo">Renovaciones y retención</summary>
        <app-grid-layout tipo="kpi-grid">
          <app-kpi-card label="Retención de pólizas" [valor]="retencion(r) + '%'" icono="autorenew" [sub]="r.indicadores.renovadas + ' renovadas de ' + (r.indicadores.renovadas + r.indicadores.noRenovadas) + ' cerradas'" [variante]="retencion(r) >= 50 ? 'exito' : 'alerta'" />
          <app-kpi-card label="Renovaciones en gestión" [valor]="r.indicadores.renovacionesEnGestion" icono="pending_actions" [sub]="r.indicadores.renovacionesTotal + ' pólizas en la hoja de renovaciones'" />
          <app-kpi-card label="Desocupaciones" [valor]="r.indicadores.desocupaciones" icono="logout" [tono]="r.indicadores.desocupaciones > 0 ? 'danger' : 'none'" sub="Inmuebles que el arrendatario entrega" />
          <app-kpi-card label="Casos especiales" [valor]="r.indicadores.casosEspeciales" icono="emergency" sub="Requieren decisión técnica" />
        </app-grid-layout>
        </details>

        <details class="resumen__seccion" open>
          <summary class="resumen__grupo">Brokers</summary>
        <app-grid-layout tipo="kpi-grid">
          <app-kpi-card label="Brokers activos" [valor]="r.brokersActivos" icono="groups" [sub]="r.prospectos + ' prospectos en vinculación'" />
          <app-kpi-card label="Radicaciones en curso" [valor]="r.negociosEnCurso" icono="work_history" sub="Radicadas aún sin póliza" />
          @if (rendimiento(); as d) {
            @if (d.porcentajeComercial !== null) {
            <app-kpi-card label="Conversión de prospectos" [valor]="pct(d.prospectosConvertidos, d.prospectosConvertidos + d.prospectosActivos) + '%'" icono="how_to_reg"
              [sub]="d.prospectosConvertidos + ' pasaron a broker · ' + d.prospectosActivos + ' en vinculación'" />
            <app-kpi-card label="Cotización → póliza" [valor]="pct(d.expedidas, d.cotizaciones) + '%'" icono="trending_up"
              [sub]="d.cotizaciones + ' cotizaciones · ' + d.radicaciones + ' radicadas · ' + d.expedidas + ' pólizas'" />
              <app-kpi-card label="Tu comisión estimada" [valor]="compacto(d.comisionComercial)" icono="badge"
                [sub]="d.porcentajeComercial + ' % sobre la prima sin IVA de tu cartera'" />
            }
          }
        </app-grid-layout>
        </details>


        <app-grid-layout tipo="dash-grid">
          <app-ranking-barras
            etiqueta="Producción"
            titulo="Brokers top por ingreso"
            icono="leaderboard"
            mensajeVacio="Todavía no hay pólizas expedidas."
            [items]="topBrokers()"
          />
          <app-ranking-barras
            etiqueta="Dinero"
            titulo="Ingresos y comisiones"
            icono="savings"
            mensajeVacio="Sin movimientos de dinero."
            [items]="dinero()"
          />
        </app-grid-layout>
      </div>
    }
  </app-estado-vista>

  <app-form-section-card
    [numero]="1"
    icono="monitoring"
    titulo="Movimientos en vivo"
    [subtitulo]="'Se actualiza cada 30 segundos' + (actualizado() ? ' · última lectura ' + actualizado()!.toLocaleTimeString('es-CO') : '')"
  >
    <app-data-table
      [columnas]="columnasMovimientos"
      [filas]="filasMovimientos()"
      [total]="filasMovimientos().length"
      [tamanoPagina]="15"
      [conBusqueda]="true"
      placeholderBusqueda="Buscar por broker, tipo o referencia…"
      mensajeVacio="Aún no hay movimientos."
      ariaLabel="Movimientos en vivo"
    />
  </app-form-section-card>

  <!-- Sincronización con las hojas del área: al final de la vista, máximo 5 filas por página. -->
  @if (sincronizaciones().length) {
    <details class="resumen__seccion" open>
      <summary class="resumen__grupo">Sincronización con las hojas del área</summary>
    <app-data-table
      [columnas]="columnasSincronizacion"
      [filas]="filasSincronizacion()"
      [total]="filasSincronizacion().length"
      [tamanoPagina]="5"
      ariaLabel="Última corrida de cada sincronización con las hojas del área"
    />
    </details>
  }
</section>
