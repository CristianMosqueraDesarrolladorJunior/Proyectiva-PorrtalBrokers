<!--
  Shell_Aplicacion (Req 4, 39.5): topbar + sidebar + main-content con router-outlet.

  Estrategia responsiva (Req 36.3, 36.5, 36.6): el botón de menú y el overlay solo
  son visibles en tablet/móvil (CSS); alternan el cajón del sidebar.

  AI Copilot (Chat_Asistente) OCULTO en el rediseño "Proyectiva Broker Nexus".
  Se conserva el componente en disco; solo se retira del layout. Para
  reactivarlo, descomentar la siguiente línea (y su import en shell.component.ts).
  <app-chat-asistente />
-->
<a class="skip-link" href="#contenido-principal" (click)="irAlContenido($event)">Saltar al contenido</a>
<div
  class="app-wrapper"
  [class.app-wrapper--sidebar-abierto]="sidebarAbierto()"
  [class.app-wrapper--colapsado]="layout.sidebarColapsado()"
  [class.app-wrapper--completa]="layout.pantallaCompleta()"
>
  <app-topbar
    class="topbar"
    [menuAbierto]="sidebarAbierto()"
    (menu)="alternarSidebar()"
    [notificaciones]="notificaciones()"
    (buscar)="buscar($event)"
    (abrirNotificacion)="abrirNotificacion($event)"
    (marcarTodas)="marcarTodasLeidas()"
  />

  <!-- Navegación lateral y perfil del Broker (Req 4). Cajón en tablet/móvil. -->
  <div id="sidebar-navegacion">
    <app-sidebar
      [abierto]="sidebarAbierto()"
      [mostrarVip]="false"
      [conSalir]="true"
      (cerrar)="cerrarSidebar()"
      (salir)="salir()"
    />
  </div>

  <!-- Superposición que pliega el cajón al pulsarla (solo tablet/móvil, Req 36.5). -->
  <div
    class="sidebar-overlay"
    (click)="cerrarSidebar()"
    aria-hidden="true"
  ></div>

  <!-- Área de contenido: la sección activa se renderiza aquí (Req 4.2). -->
  <main #contenido class="main-content" id="contenido-principal" tabindex="-1">
    <router-outlet />
  </main>
</div>
