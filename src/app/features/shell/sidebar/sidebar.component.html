<!--
  Sidebar de navegación del Shell_Aplicacion (Req 4).
  Reproduce el marcado del prototipo (sidebar-profile/avatar/sidebar-nav/
  nav-item/sidebar-footer). El acceso activo se marca con routerLinkActive
  (Req 4.2) y el perfil del Broker proviene del SessionService (Req 4.3).
-->
<aside class="sidebar" [class.sidebar--abierto]="abierto">
  <!-- Perfil del Broker autenticado: nombre y rol (Req 4.3). -->
  <div class="sidebar-profile">
    <div class="avatar" aria-hidden="true">{{ iniciales(perfil()?.nombre) }}</div>
    @if (perfil(); as broker) {
      <div>
        <strong>{{ broker.nombre }}</strong>
        <br />
        <small>{{ broker.rol }}</small>
      </div>
    }

    <!--
      Control de cierre del cajón, visible solo en tablet/móvil (Estrategia
      responsiva, Req 36.5). En desktop permanece oculto por CSS. Mantiene foco
      visible y etiqueta accesible (Req 27, 36.6).
    -->
    <button
      type="button"
      class="sidebar-close"
      aria-label="Cerrar menú de navegación"
      (click)="solicitarCierre()"
    >
      <span aria-hidden="true">✕</span>
    </button>
  </div>

  <!-- Accesos de navegación (Req 4.1). El ítem activo se resalta (Req 4.2). -->
  <nav class="sidebar-nav" aria-label="Navegación principal">
    @for (acceso of accesos; track acceso.ruta) {
      <a
        class="nav-item"
        [routerLink]="['/app', acceso.ruta]"
        routerLinkActive="active"
        #enlace="routerLinkActive"
        [attr.aria-current]="enlace.isActive ? 'page' : null"
        (click)="solicitarCierre()"
      >
        <span class="nav-item__icono" aria-hidden="true">{{ acceso.icono }}</span>
        {{ acceso.etiqueta }}
      </a>
    }
  </nav>

  <!-- Pie del sidebar con la marca del panel (prototipo). -->
  <div class="sidebar-footer">
    <div class="sidebar-footer__marca">
      <div class="sidebar-footer__logo" aria-hidden="true">P</div>
      <div>
        <strong>Proyectiva</strong>
        <br />
        <small>PANEL BRÓKER</small>
      </div>
    </div>
  </div>
</aside>
