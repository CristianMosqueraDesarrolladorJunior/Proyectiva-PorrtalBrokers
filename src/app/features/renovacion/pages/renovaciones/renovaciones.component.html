<section class="renovaciones">
  <app-page-header
    eyebrow="Portafolio"
    titulo="Gestión de Renovaciones"
    subtitulo="Consulta y gestiona las renovaciones de tus pólizas. Las vencidas pasan por inducción."
  ></app-page-header>

  <app-grid-layout tipo="kpi-grid">
    <app-kpi-card label="Pólizas en portafolio" [valor]="portafolio()?.total ?? '—'" icono="folder_open" sub="Total de pólizas activas" />
    <app-kpi-card label="Renovadas" [valor]="portafolio()?.renovadas ?? '—'" icono="task_alt" variante="exito" sub="Al día con renovaciones" />
    <app-kpi-card label="Próximas a renovar" [valor]="portafolio()?.proximasARenovar ?? '—'" icono="event_upcoming" sub="En los próximos 30 días" />
    <app-kpi-card label="A punto de vencer" [valor]="portafolio()?.aPuntoDeVencer ?? '—'" icono="warning" variante="alerta" sub="Requieren atención inmediata" />
  </app-grid-layout>

  <app-barra-acciones>
    <div filtros>
      <app-form-field label="Buscar póliza" controlId="renov-busqueda">
        <input
          id="renov-busqueda"
          type="search"
          autocomplete="off"
          placeholder="Número de póliza"
          [value]="busqueda()"
          (input)="busqueda.set($any($event.target).value)"
        />
      </app-form-field>
    </div>
  </app-barra-acciones>

  <app-estado-vista
    [cargando]="cargando()"
    [error]="error()"
    [vacio]="filas().length === 0"
    entidad="pólizas"
    iconoVacio="autorenew"
    [tituloVacio]="busqueda() ? 'Ninguna póliza coincide con la búsqueda' : 'No tienes pólizas por renovar'"
    descripcionVacio="Cuando tus pólizas se acerquen al vencimiento aparecerán aquí."
    (reintentar)="cargar()"
  >
    <app-data-table
      [columnas]="columnas"
      [filas]="filas()"
      [total]="filas().length"
      [tamanoPagina]="filas().length || 1"
      ariaLabel="Listado de pólizas para renovación"
      (seleccionFila)="onSeleccionFila($event)"
      (accion)="onGestionar($event)"
    ></app-data-table>
  </app-estado-vista>
</section>
