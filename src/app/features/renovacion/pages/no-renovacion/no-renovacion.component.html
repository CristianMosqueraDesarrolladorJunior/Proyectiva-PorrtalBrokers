<section class="no-renovacion" aria-labelledby="no-renovacion-titulo">
  <app-page-header
    eyebrow="Renovaciones"
    tituloId="no-renovacion-titulo"
    titulo="Notificar no renovación"
    subtitulo="Indícanos por qué el cliente no desea renovar su póliza para gestionar la baja."
  ></app-page-header>

  @if (envioExitoso()) {
    <app-success-screen
      titulo="No renovación registrada"
      mensaje="Registramos la solicitud de no renovación. El equipo gestionará la baja de la póliza."
      [tarjetas]="tarjetas()"
      [mostrarVolver]="false"
    ></app-success-screen>
  } @else if (!numeroPoliza) {
    <!-- Sin póliza (abierto por URL) no hay trámite que enviar: se inicia desde Renovaciones. -->
    <app-alert-banner variante="warning" titulo="Elige la póliza">
      Este trámite se inicia desde Renovaciones: busca la póliza y pulsa «Gestionar».
    </app-alert-banner>
  } @else {
    <!-- Motivo principal obligatorio del conjunto definido (Req 22.1) -->
    <div class="no-renovacion-campo">
      <app-form-field
        label="Motivo principal"
        [requerido]="true"
        [error]="errorMotivo()"
        controlId="no-renovacion-motivo"
      >
        <app-radio-group
          [opciones]="opcionesMotivo()"
          [valor]="motivo()"
          (valorChange)="motivo.set($event)"
          ariaLabel="Motivo de la no renovación"
        ></app-radio-group>
      </app-form-field>
    </div>

    <!-- Observaciones opcionales (Req 22.1) -->
    <div class="no-renovacion-campo">
      <app-form-field
        label="Observaciones"
        ayuda="Opcional: agrega cualquier detalle relevante."
        controlId="no-renovacion-observaciones"
      >
        <textarea
          id="no-renovacion-observaciones"
          rows="4"
          autocomplete="off"
          [ngModel]="observaciones()"
          (ngModelChange)="observaciones.set($event)"
        ></textarea>
      </app-form-field>
    </div>

    @if (enviando()) {
      <app-escalerita-loader texto="Registrando no renovación..."></app-escalerita-loader>
    }


    <div class="no-renovacion-acciones">
      <app-boton
        variante="primary"
        [disabled]="enviando()"
        (clicked)="confirmar()"
      >
        {{ enviando() ? 'Enviando…' : 'Confirmar no renovación' }}
      </app-boton>
    </div>
  }
</section>
