<ol class="stepper" aria-label="Progreso por pasos">
  @for (paso of pasos; track trackPaso($index); let indice = $index) {
    <li
      class="step"
      [class.active]="estadoPaso(indice) === 'active'"
      [class.done]="estadoPaso(indice) === 'done'"
      [attr.aria-current]="estadoPaso(indice) === 'active' ? 'step' : null"
    >
      <span class="step__num" aria-hidden="true">{{ indice + 1 }}</span>
      <span class="step__label">{{ paso }}</span>
    </li>
  }
</ol>
